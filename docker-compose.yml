services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT}:${BACKEND_CONTAINER_PORT}"
    env_file:
      - "${COMPOSE_ENV_FILE:-.env}"
    environment:
      BACKEND_HOST: ${BACKEND_HOST}
      BACKEND_CONTAINER_PORT: ${BACKEND_CONTAINER_PORT}
      INFLUXDB_URL: ${INFLUXDB_URL}
      DATA_DIR: /app/data
      COMPARISON_PATH: /app/comparison.json
      MODEL_PATH: /app/data/model.json
      EXPERIMENTS_DIR: /app/data/experiments
    command:
      [
        "sh",
        "-c",
        "python /app/backend/ingest.py /app/comparison.json && exec uvicorn app.main:app --app-dir /app/backend --host \"$${BACKEND_HOST}\" --port \"$${BACKEND_CONTAINER_PORT}\""
      ]
    volumes:
      - ./data:/app/data
      - ./comparison.json:/app/comparison.json:ro
    depends_on:
      influxdb:
        condition: service_healthy
    networks:
      - model-network

  influxdb:
    image: influxdb:2.7-alpine
    ports:
      - "${INFLUXDB_PORT}:${INFLUXDB_CONTAINER_PORT}"
    env_file:
      - "${COMPOSE_ENV_FILE:-.env}"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USERNAME}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET}
      DOCKER_INFLUXDB_INIT_RETENTION: ${INFLUXDB_RETENTION:-365d}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN}
      INFLUXDB_CONTAINER_PORT: ${INFLUXDB_CONTAINER_PORT}
    volumes:
      - influx_data:/var/lib/influxdb2
      - influx_config:/etc/influxdb2
    healthcheck:
      test: ["CMD-SHELL", "influx ping --host http://localhost:$${INFLUXDB_CONTAINER_PORT}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - model-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:${BACKEND_PORT:-8000}}
        NEXT_PUBLIC_GRAFANA_DASHBOARD_URL: ${NEXT_PUBLIC_GRAFANA_DASHBOARD_URL:-}
    ports:
      - "${FRONTEND_PORT:-3100}:${FRONTEND_CONTAINER_PORT:-3000}"
    environment:
      PORT: ${FRONTEND_CONTAINER_PORT:-3000}
      HOSTNAME: 0.0.0.0
    depends_on:
      - backend
    networks:
      - model-network

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "${GRAFANA_PORT}:${GRAFANA_CONTAINER_PORT}"
    env_file:
      - "${COMPOSE_ENV_FILE:-.env}"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SERVER_HTTP_PORT: ${GRAFANA_CONTAINER_PORT}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning:ro
    depends_on:
      influxdb:
        condition: service_healthy
    networks:
      - model-network

volumes:
  influx_data:
  influx_config:
  grafana_data:

networks:
  model-network:
    driver: bridge